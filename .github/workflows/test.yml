name: Test
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check README is up to date
        run: |
          node ./scripts/update-readme.ts
          if ! git diff --quiet README.md; then
            echo "README.md is out of date. Run 'npm run postbuild' to update it."
            git diff README.md
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Run the tests
        run: npm run test

      - name: Run tests with coverage
        run: npx vitest --coverage.enabled true

      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
